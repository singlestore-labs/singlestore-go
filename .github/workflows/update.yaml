name: update

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27
      - uses: actions/checkout@v7
      - run: |
            ./management/.update
